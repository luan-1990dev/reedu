name: reedu
description: "Reedu - Reeducação Alimentar Inteligente"
publish_to: 'none'

version: 1.0.4+27

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  firebase_messaging: ^15.2.10
  cloud_firestore: ^5.6.4
  google_sign_in: ^6.2.2
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  fl_chart: ^0.70.2
  pdfx: ^2.4.0
  flutter_pdfview: ^1.3.2

  # ATUALIZADOS PARA NOTIFICAÇÕES (Versões do seu script)
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.0.2

  # MANTIDO EM 0.19.0: Para não quebrar o syncfusion_flutter_pdf
  intl: ^0.19.0

  file_picker: ^8.0.0
  syncfusion_flutter_pdf: ^25.1.37
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

# CRUCIAL: Mantendo o override para evitar erros de compilação no Android
dependency_overrides:
  flutter_timezone: ^5.0.2

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/